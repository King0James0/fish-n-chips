<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fish N Chips — PixiJS build</title>
<style>html,body{margin:0;height:100%;background:#02040c;overflow:hidden}canvas{display:block}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="touch" aria-hidden="true">
    <div class="stick" id="stick"><div class="knob"></div></div>
    <div class="btns">
      <button class="tb" data-act="form">SHIFT</button>
      <button class="tb" data-act="ability">USE</button>
      <button class="tb big" data-act="fire">FIRE</button>
    </div>
  </div>
<script type="module">
// Native PixiJS host — the SOLE build.
//
// The verified Game (physics / AI / level logic in js/main.js) runs on an
// OFFSCREEN 2D canvas purely as a state holder. Its Canvas2D draw() is
// suppressed (game.nativeRender = true) and the entire draw layer is produced
// by js/renderer.js as real Pixi containers / sprites / filters. No Canvas
// frame is ever blitted into the scene — this is a true native rewrite.
window.__PIXI_HOST__ = true;

import * as PIXI from './vendor/pixi.mjs';
import { Game } from './js/main.js';
import { createRenderer } from './js/renderer.js';

window.__PIXI = PIXI;
const S = window.__pixi = {
  ready: false, err: null,
  fx: { bloom: false, vignette: false, displace: false, tint: false, glow: false, particles: false },
};

async function main(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const app = new PIXI.Application();
  await app.init({ width: window.innerWidth, height: window.innerHeight, resolution: dpr,
                   background: '#02040c', antialias: true, preference: 'webgl', autoDensity: true });
  document.body.appendChild(app.canvas);
  S.app = app;

  // The game's own canvas is OFFSCREEN — never shown. It exists only because the
  // verified Game class stores this.cv / this.ctx / light / bloom and computes
  // fit() from cv.width. draw() is suppressed, so its 2D context is never used.
  const cv = document.createElement('canvas');
  const game = new Game(cv);
  game.nativeRender = true;          // main.js draw() early-returns; renderer.js draws
  window.__game = game;              // same handle the smoke/shot harness uses
  S.game = game;

  // The native renderer owns the whole stage: scene graph + filters + HUD + overlays.
  const R = createRenderer(PIXI, game, app);
  S.renderer = R;
  S.fx.bloom = true; S.fx.vignette = true; S.fx.glow = true; S.fx.particles = true;
  S.fx.displace = !!R.disp; S.fx.tint = !!R.cmf;

  // ---- touch controls (mobile / itch.io) — the native build owns this DOM now ----
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) {
    document.body.classList.add('touch');
    const stick = document.getElementById('stick');
    const knob = stick.querySelector('.knob');
    const cl = (v, a, b) => v < a ? a : v > b ? b : v;
    let pid = null; const R = 46;
    const move = (e) => {
      const r = stick.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2);
      let dy = e.clientY - (r.top + r.height / 2);
      const m = Math.hypot(dx, dy);
      if (m > R) { dx *= R / m; dy *= R / m; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      game.touchAxis = { x: cl(dx / R, -1, 1), y: cl(dy / R, -1, 1) };
    };
    stick.addEventListener('pointerdown', (e) => { pid = e.pointerId; stick.setPointerCapture(pid); move(e); });
    stick.addEventListener('pointermove', (e) => { if (pid === e.pointerId) move(e); });
    const end = (e) => { if (pid !== e.pointerId) return; pid = null; knob.style.transform = ''; game.touchAxis = null; };
    stick.addEventListener('pointerup', end);
    stick.addEventListener('pointercancel', end);
    document.querySelectorAll('.tb').forEach((b) => {
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (game.state !== 'play') { game.tap(); return; }
        const act = b.dataset.act;
        if (act === 'form') game.cycleForm(1);
        else if (act === 'fire') { game.firing = true; game.aim = Math.atan2(game.vy, game.vx); }
        else game.ability();
      });
      const stopFire = (e) => { if (b.dataset.act === 'fire') game.firing = false; };
      b.addEventListener('pointerup', stopFire);
      b.addEventListener('pointercancel', stopFire);
      b.addEventListener('pointerleave', stopFire);
    });
  }

  // Input: map the *visible* Pixi canvas rect into the game's device-pixel aim
  // space. The game's own canvas is offscreen, so its default setMouse would
  // divide by a zero-width rect and yield NaN. Use the same dpr the renderer uses
  // so aim (mouse - _ox)/_s stays consistent with the camera.
  game.setMouse = (e)=>{
    const r = app.canvas.getBoundingClientRect();
    const g = game.dpr || dpr;
    const cx = (e.clientX != null ? e.clientX : (e.global ? e.global.x : 0));
    const cy = (e.clientY != null ? e.clientY : (e.global ? e.global.y : 0));
    game.mouse = { x: (cx - r.left) * g, y: (cy - r.top) * g };
  };

  // Pointerdown goes through the Pixi stage; move / up / keys are on window (main.js).
  app.stage.eventMode = 'static';
  app.stage.hitArea = new PIXI.Rectangle(0, 0, app.screen.width, app.screen.height);
  app.stage.on('pointerdown', (e)=>{ game.tap(); if(game.state === 'play'){ game.setMouse(e); game.firing = true; } });
  app.stage.on('pointerup', ()=>{ game.firing = false; });

  function resize(){
    game.resize();
    app.renderer.resize(window.innerWidth, window.innerHeight);
    if (R.resize) R.resize();
  }
  window.addEventListener('resize', resize);

  // ---- the Pixi ticker drives update + native render ----
  let frozen = false;
  function step(dt){ game.pollPad(); game.time += dt; game.update(dt); R.render(); game.pressed.clear(); }
  app.ticker.add((tf)=>{ if(frozen) return; step(Math.min(0.033, tf.deltaMS / 1000)); });

  // scriptable, deterministic stepping for the smoke/shot harness
  S.step = (n)=>{ frozen = true; for(let i = 0; i < (n || 1); i++) step(0.016); };
  S.freeze = ()=>{ frozen = true; };
  S.resume = ()=>{ frozen = false; };
  S.render = ()=>R.render();

  // mean RGB of the composited (shimmer + graded) frame — proves the grade is per-act.
  S.gradeRGB = async ()=>{
    R.render();
    const rt = PIXI.RenderTexture.create({ width: 64, height: 36, resolution: 1 });
    app.renderer.render({ container: R.graded, target: rt, clear: true });
    const px = await app.renderer.extract.pixels(rt);
    rt.destroy();
    const d = px.pixels || px;
    let r = 0, g = 0, b = 0, n = 0; for(let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    return { r: +(r / n).toFixed(1), g: +(g / n).toFixed(1), b: +(b / n).toFixed(1) };
  };

  // shimmer detector: render the graded container at two noise-sprite offsets and
  // report mean per-pixel difference (0 => displacement doing nothing).
  S.shimmerTest = async ()=>{
    if(!R.disp) return -1;
    R.render();
    const rt = PIXI.RenderTexture.create({ width: app.screen.width, height: app.screen.height, resolution: 1 });
    const grab = async ()=>{ app.render(); app.renderer.render({ container: R.graded, target: rt, clear: true }); const px = await app.renderer.extract.pixels(rt); return px.pixels || px; };
    R.dispSprite.x = 0; R.dispSprite.y = 0; const a = await grab();
    R.dispSprite.x = 48; R.dispSprite.y = 33; const b = await grab();
    rt.destroy();
    let diff = 0, n = 0; for(let i = 0; i < a.length; i += 4 * 13){ diff += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); n++; }
    return +(diff / n).toFixed(2);
  };

  S.ready = true;
}
main().catch(e=>{ S.err = String(e); });
</script>
</body>
</html>
