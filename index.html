<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Fish N Chips — a bioluminescent shapeshifting descent. A GitHub Game Off 2026 entry on the theme SHIFT.">
<meta name="theme-color" content="#02040c">
<title>Fish N Chips — Game Off 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="touch" aria-hidden="true">
    <div class="stick" id="stick"><div class="knob"></div></div>
    <div class="btns">
      <button class="tb" data-act="form">SHIFT</button>
      <button class="tb" data-act="ability">USE</button>
      <button class="tb big" data-act="fire">FIRE</button>
    </div>
  </div>

  <noscript>
    <div class="nojs">Fish N Chips needs JavaScript enabled to dive.</div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
